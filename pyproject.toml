[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-analyst-serv"
version = "0.1.0"
description = "MCP Server with Prompt, Tools for Analytics"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Ashutosh Singh", email = "ashutosh71195@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp[cli]>=1.7.1",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/mcp-analyst-serv"
"Bug Tracker" = "https://github.com/yourusername/mcp-analyst-serv/issues"

[project.scripts]
mcp-analyst-serv = "mcp_analyst_serv.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy"
]
test = [
    "pytest-cov"
]
