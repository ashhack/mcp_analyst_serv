[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-analyst-serv"
version = "0.1.0"
description = "MCP Server with Prompt, Tools for Analytics"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Ashutosh Singh", email = "ashutosh71195@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "mcp[cli]>=1.7.1",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/mcp-analyst-serv"
"Bug Tracker" = "https://github.com/yourusername/mcp-analyst-serv/issues"
"Source" = "https://github.com/yourusername/mcp-analyst-serv"

[project.scripts]
mcp-analyst-serv = "mcp_analyst_serv.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mcp_analyst_serv*"]

[tool.ruff]
line-length = 88
target-version = "py313"
select = ["E", "F", "I"]
ignore = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.0.280",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.0.0"
]
test = [
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=mcp_analyst_serv --cov-report=term-missing"
