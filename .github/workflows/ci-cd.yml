name: MCP Server CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel
        pip install -e .
        
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check .
      continue-on-error: true  # Optional: set to false to make linting errors fail the workflow
      
    - name: Build package
      run: |
        python -m build
        
    - name: Validate server
      run: |
        # Validate that the package can be imported and server can be created
        python -c "from mcp_analyst_serv.server import create_server; server = create_server(); print(f'Server validation successful: {server.name}')"
        
    - name: Test CLI entry point
      run: |
        # Install the package in the current environment
        pip install -e .
        # Verify the CLI entry point is properly configured
        which mcp-analyst-serv
