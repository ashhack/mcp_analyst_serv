name: MCP Server CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev] || pip install .
        
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check .
      continue-on-error: true  # Optional: set to false to make linting errors fail the workflow
      
    - name: Validate server
      run: |
        # Simple validation to check if the server can start
        python -c "import main; print('Server validation successful')"
